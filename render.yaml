services:
  - type: web
    name: colonvision-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && mkdir -p .torch_cache/hub/checkpoints && curl -sSL -o .torch_cache/hub/checkpoints/resnet50-0676ba61.pth https://download.pytorch.org/models/resnet50-0676ba61.pth"
    startCommand: "python run.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TORCH_HOME
        value: /opt/render/project/src/.torch_cache
